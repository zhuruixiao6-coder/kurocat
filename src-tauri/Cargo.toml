[package]
name = "kuro-cat-pet"
version = "5.9.16"
description = "KuroCat desktop pet - a typing cat companion (keyboard visualizer, accessories, custom skins)"
authors = ["zhuruixiao6-coder"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zhuruixiao6-coder/kurocat"
homepage = "https://github.com/zhuruixiao6-coder/kurocat"

[lib]
name = "kuro_cat_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KuroCat"
path = "src/main.rs"

[features]
default = []
layout-108 = []
win7 = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSGraphics", "NSScreen", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFUUID"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSValue", "block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
